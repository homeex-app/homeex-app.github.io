name: Export exercises file

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes; does nothing unless exercises or settings changed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: export-exercises
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/export_exercises.py
      - run: python tools/export_settings.py
      - name: Save the exercises and settings files
        run: |
          git add data/exercises.json data/settings.json 2>/dev/null || git add data/exercises.json
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git -c user.name="Home Ex" -c user.email=noreply@homeex-app.github.io commit -m "Update exercises/settings files"
          git pull --rebase -q
          git push
