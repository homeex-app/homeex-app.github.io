name: Copy images from Drive

on:
  schedule:
    - cron: "0 1 * * *"   # 01:00 UTC = 3 AM Cairo (winter)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: copy-images
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python tools/copy_images.py
      - name: Save new images
        run: |
          git add img
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git -c user.name="Home Ex" -c user.email=noreply@homeex-app.github.io commit -m "Copy new exercise images from Drive"
          git push
